include:
  - compose.backends.yaml

services:
  gateway:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
        target: /run/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
        target: /run/tls/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx-includes
        target: /etc/nginx/modu-home
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - relay
      - routing
    networks:
      frontend: {}
      backend:
        ipv4_address: 172.29.248.2

networks:
  frontend: {}
