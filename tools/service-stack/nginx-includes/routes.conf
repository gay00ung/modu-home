if ($http_transfer_encoding != "") { return 400; }
if ($http_expect != "") { return 400; }

location = /healthz {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    default_type application/json;
    return 200 '{"service":"modu-home","gateway":"ready"}';
}

location = /v1/rooms {
    if ($request_method != POST) { return 405; }
    limit_req zone=rooms burst=2 nodelay;
    proxy_pass http://relay:48680;
}

location ^~ /v1/ {
    limit_req zone=relay burst=20 nodelay;
    proxy_pass http://relay:48680;
}

location ^~ /dropoff/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=relay burst=20 nodelay;
    proxy_pass http://relay:48680;
}

location ^~ /route/v1/driving/ {
    if ($request_method != GET) { return 405; }
    limit_req zone=routing burst=30 nodelay;
    proxy_pass http://routing:5000;
}

location / {
    return 404;
}
