worker_processes 2;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/modu-home/http-common.conf;

    server {
        listen 8080;
        server_name _;
        set_real_ip_from 172.29.247.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        include /etc/nginx/modu-home/routes.conf;
    }
}
