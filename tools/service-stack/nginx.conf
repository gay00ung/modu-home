worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 12k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;

    limit_req_zone $binary_remote_addr zone=rooms:1m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=relay:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=routing:1m rate=10r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 5s;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;

        if ($http_transfer_encoding != "") { return 400; }
        if ($http_expect != "") { return 400; }

        location = /v1/rooms {
            if ($request_method != POST) { return 405; }
            limit_req zone=rooms burst=2 nodelay;
            proxy_pass http://relay:48680;
        }

        location ^~ /v1/ {
            limit_req zone=relay burst=20 nodelay;
            proxy_pass http://relay:48680;
        }

        location ^~ /route/v1/driving/ {
            if ($request_method != GET) { return 405; }
            limit_req zone=routing burst=30 nodelay;
            proxy_pass http://routing:5000;
        }

        location / {
            return 404;
        }
    }
}
